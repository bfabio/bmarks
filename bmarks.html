<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bmarks</title>
<link rel="icon" href="icons/bmarks.svg">
<link rel="stylesheet" href="bmarks.css">
</head>
<body>
<main>
  <header class="head">
    <h1>bmarks</h1>
    <span id="hint" class="hint"></span>
    <span id="busy" class="busy" role="status" aria-label="Working" hidden></span>
    <button type="button" id="toggle-host" class="chip switch" aria-pressed="true" title="Hide the domain of each bookmark">
      <span class="track"></span>
      Show domain
    </button>
    <div id="density" class="views" role="group" aria-label="Row spacing">
      <button type="button" data-density="roomy" aria-pressed="false" aria-label="Spacious" title="Spacious">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 3h10M3 8h10M3 13h10"/>
        </svg>
      </button>
      <button type="button" data-density="default" aria-pressed="true" aria-label="Normal" title="Normal">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 4.5h10M3 8h10M3 11.5h10"/>
        </svg>
      </button>
      <button type="button" data-density="compact" aria-pressed="false" aria-label="Compact" title="Compact">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M3 4h10M3 6.67h10M3 9.33h10M3 12h10"/>
        </svg>
      </button>
    </div>
  </header>
  <nav id="views" class="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" data-view="folders" aria-selected="true">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <path d="M1.8 4.2a1 1 0 0 1 1-1h3.4l1.5 1.6h5.5a1 1 0 0 1 1 1v6.4a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z"/>
      </svg>
      Folders
    </button>
    <button type="button" role="tab" data-view="sites" aria-selected="false">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="8" cy="8" r="6"/>
        <ellipse cx="8" cy="8" rx="2.7" ry="6"/>
        <path d="M2.3 8h11.4"/>
      </svg>
      Sites
    </button>
    <button type="button" role="tab" data-view="broken" aria-selected="false">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M8 2.2 14.6 13H1.4z"/>
        <path d="M8 6.4v3.1"/>
        <circle cx="8" cy="11.4" r=".85" fill="currentColor" stroke="none"/>
      </svg>
      Broken links
    </button>
  </nav>
  <p id="status" class="status" role="alert" hidden>
    <span id="status-text"></span>
    <button type="button" id="undo" hidden>Undo</button>
    <button type="button" id="dismiss" class="dismiss" aria-label="Dismiss" title="Dismiss">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 4l8 8M12 4l-8 8"/>
      </svg>
    </button>
  </p>
  <button type="button" id="back" class="chip back" hidden>
    <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 3.5 5 8l4.5 4.5"/>
    </svg>
    <span id="back-name">All</span>
  </button>
  <div id="check" class="check" hidden>
    <button type="button" id="check-run" class="chip">Check every link</button>
    <span id="check-note" class="check-note"></span>
  </div>
  <div id="sheet" class="sheet"></div>
</main>
<button type="button" id="trash" class="trash" aria-label="Delete this bookmark" title="Delete this bookmark" hidden>
  <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.6 4.3h10.8M6.4 4.3V2.8h3.2v1.5M4 4.3l.7 8.4a.9.9 0 0 0 .9.8h4.8a.9.9 0 0 0 .9-.8l.7-8.4"/>
  </svg>
</button>
<div id="menu" class="menu" hidden>
  <p id="menu-title" class="menu-title"></p>
  <button type="button" data-action="open-tab" data-for="bookmark">Open in new tab</button>
  <button type="button" data-action="copy" data-for="bookmark">Copy link</button>
  <button type="button" data-action="new-folder" data-for="folder">New folder inside</button>
  <button type="button" data-action="rename" data-skip-root>Rename</button>
  <button type="button" data-action="delete" class="danger" data-skip-root>Delete</button>
</div>
<script src="tree.js"></script>
<script src="check.js"></script>
<script src="page.js"></script>
</body>
</html>
